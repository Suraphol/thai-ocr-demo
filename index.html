<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thai OCR Demo (vanilla JS + ONNX Runtime Web)</title>
<style>
  body { font-family: system-ui, "Noto Sans Thai", "Thonburi", "Leelawadee UI", sans-serif; max-width: 1400px; margin: 1.5rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  #drop { border: 2px dashed #999; border-radius: 8px; padding: 1.2rem; text-align: center; color: #555; }
  #drop.over { background: #eef6ff; border-color: #3b82f6; }
  #status { margin: .8rem 0; font-size: .9rem; color: #444; min-height: 1.2em; }
  /* ซ้าย = ข้อความ, ขวา = รูป (จอแคบจะเรียงบน-ล่าง) */
  #panes { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: start; }
  .pane h3 { margin: 0 0 .5rem; display: flex; justify-content: space-between; align-items: center; }
  #textPane { position: sticky; top: 1rem; display: flex; flex-direction: column; }
  canvas { max-width: 100%; border: 1px solid #ddd; display: block; }
  textarea { width: 100%; box-sizing: border-box; height: calc(100vh - 6rem); min-height: 16rem; font-size: 1rem; line-height: 1.6; resize: vertical; }
  button { padding: .4rem .9rem; font-size: .9rem; }
  @media (max-width: 800px) {
    #panes { grid-template-columns: 1fr; }
    #textPane { position: static; order: 2; }
    textarea { height: 14rem; }
  }
</style>
</head>
<body>
<h1>Thai OCR Demo (vanilla JS)</h1>
<div id="drop">
  <p>ลากรูปมาวาง, วางรูป (Ctrl/Cmd+V) หรือเลือกไฟล์</p>
  <input type="file" id="file" accept="image/*">
</div>
<div id="status">พร้อมใช้งาน — ทำงานแบบ offline (โหลดโมเดลจากโฟลเดอร์ models/ ในเครื่อง)</div>
<div id="panes">
  <div class="pane" id="textPane">
    <h3>ผลลัพธ์ <button id="copy">คัดลอกข้อความ</button></h3>
    <textarea id="out" readonly></textarea>
  </div>
  <div class="pane">
    <h3>รูปต้นฉบับ</h3>
    <canvas id="view"></canvas>
  </div>
</div>

<script type="module">
// ====== ตั้งค่า (ปรับได้ที่นี่) ======
// ไฟล์ทั้งหมดอยู่ในเครื่อง (ดาวน์โหลดด้วย download_assets.sh)
const ORT_BASE   = new URL("./lib/ort/", location.href).href;
const MODEL_BASE = "./models/";
// ถ้าไฟล์อยู่ใน subfolder อื่น ให้แก้ path 4 บรรทัดนี้
const DET_URL  = MODEL_BASE + "det.onnx";
const REC_URL  = MODEL_BASE + "rec.onnx";
const DICT_URL = MODEL_BASE + "rec_dict.txt";
const CFG_URL  = MODEL_BASE + "config.json";

const DET_MAX_SIDE = 1280;  // ด้านยาวสุดของภาพที่ส่งเข้า detector
const DET_THRESH   = 0.2;   // threshold ของ probability map
const BOX_SCORE    = 0.4;   // คะแนนเฉลี่ยขั้นต่ำของกล่อง
const UNCLIP       = 1.4;   // ขยายกล่อง

// ค่าเริ่มต้นของ recognizer และตัวกรองบรรทัด (ตรงกับ DEFAULTS ใน runtime/line_engine.py v2.1.4)
// ค่าใน models/config.json จะทับค่าเหล่านี้
const DEFAULT_CFG = {
  rec:  { height: 48, max_w: 3200, drop_below: 0, min_chars: 1, min_chars_digits: null,
          min_chars_digits_height: 0, min_chars_latin: false, junk_below: 0, junk_invalid: 1, color: "flatten" },
  rec2: { file: "", min_mixed: 1 },  // recognizer ตัวที่ 2 สำหรับฟอนต์ไม่มีหัว (2.1.2)
  join: { decimal_comma: false },
  det:  { split_gap: 1.2 },          // ตัดกล่องบรรทัดตรงช่องว่างกว้าง >= เท่านี้ของความสูงบรรทัด (0 = ปิด)
  cols: { list_rep: 0.6, list_facing: 0, list_max_w: 10, list_enum: 0 }, // กันไม่ให้รายการถูกอ่านเป็นคอลัมน์
};

// ====== state ======
let ort, detSession, recSession, rec2Session, charset, cfg;
let recChannels = 3; // ลอง 3 ช่องก่อน ถ้า error จะลอง 1 ช่อง
const $ = (id) => document.getElementById(id);
const status = (t) => ($("status").textContent = t);

// ====== โหลดโมเดล ======
async function loadModels() {
  if (detSession) return;
  status("กำลังโหลด ONNX Runtime...");
  ort = await import(ORT_BASE + "ort.wasm.min.mjs");
  ort.env.wasm.wasmPaths = ORT_BASE;
  ort.env.wasm.numThreads = 1; // ไม่ต้องใช้ cross-origin isolation

  const getBuf = async (url) => {
    const r = await fetch(url);
    if (!r.ok) throw new Error("โหลดไม่ได้: " + url + " (" + r.status + ")");
    return new Uint8Array(await r.arrayBuffer());
  };

  cfg = structuredClone(DEFAULT_CFG);
  const cfgRes = await fetch(CFG_URL);
  if (cfgRes.ok) { const c = await cfgRes.json(); for (const k in cfg) Object.assign(cfg[k], c[k]); }
  else console.warn("ไม่พบ " + CFG_URL + " ใช้ค่าเริ่มต้นแทน");

  const opts = { executionProviders: ["wasm"] };
  status("กำลังโหลดโมเดล detector...");
  detSession = await ort.InferenceSession.create(await getBuf(DET_URL), opts);
  status("กำลังโหลดโมเดล recognizer...");
  recSession = await ort.InferenceSession.create(await getBuf(REC_URL), opts);
  if (cfg.rec2.file) {
    status("กำลังโหลดโมเดล recognizer ตัวที่ 2 (ฟอนต์ไม่มีหัว)...");
    try { rec2Session = await ort.InferenceSession.create(await getBuf(MODEL_BASE + cfg.rec2.file), opts); }
    catch (e) { console.warn("ไม่ใช้ rec2:", e.message); } // ไม่มี rec2 ก็ยังอ่านได้ด้วยตัวแรก
  }

  const dictRes = await fetch(DICT_URL);
  if (!dictRes.ok) throw new Error("โหลดไม่ได้: " + DICT_URL + " (" + dictRes.status + ")");
  const dictText = await dictRes.text();
  const lines = dictText.split("\n").map((s) => s.replace(/\r$/, ""));
  if (lines[lines.length - 1] === "") lines.pop();
  charset = ["", ...lines, " "]; // index 0 = CTC blank
}

// ====== Detection ======
function runDetPre(img) {
  const scale = Math.min(1, DET_MAX_SIDE / Math.max(img.width, img.height));
  const w = Math.max(32, Math.round((img.width * scale) / 32) * 32);
  const h = Math.max(32, Math.round((img.height * scale) / 32) * 32);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;

  const n = w * h, f = new Float32Array(3 * n);
  const mean = [0.485, 0.456, 0.406], std = [0.229, 0.224, 0.225];
  for (let i = 0; i < n; i++) { // ลำดับช่อง B, G, R
    f[i]         = (d[4 * i + 2] / 255 - mean[0]) / std[0];
    f[n + i]     = (d[4 * i + 1] / 255 - mean[1]) / std[1];
    f[2 * n + i] = (d[4 * i]     / 255 - mean[2]) / std[2];
  }
  return { tensor: new ort.Tensor("float32", f, [1, 3, h, w]), w, h };
}

function findBoxes(prob, w, h, img) {
  // connected components บน probability map ที่ผ่าน threshold
  const mask = new Uint8Array(w * h);
  for (let i = 0; i < mask.length; i++) mask[i] = prob[i] > DET_THRESH ? 1 : 0;
  const stack = new Int32Array(w * h);
  const boxes = [];
  const sx = img.width / w, sy = img.height / h;

  for (let start = 0; start < mask.length; start++) {
    if (mask[start] !== 1) continue;
    let sp = 0, cnt = 0, sum = 0;
    let x0 = w, y0 = h, x1 = 0, y1 = 0;
    stack[sp++] = start; mask[start] = 2;
    while (sp > 0) {
      const p = stack[--sp];
      const x = p % w, y = (p / w) | 0;
      cnt++; sum += prob[p];
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
      if (x > 0     && mask[p - 1] === 1) { mask[p - 1] = 2; stack[sp++] = p - 1; }
      if (x < w - 1 && mask[p + 1] === 1) { mask[p + 1] = 2; stack[sp++] = p + 1; }
      if (y > 0     && mask[p - w] === 1) { mask[p - w] = 2; stack[sp++] = p - w; }
      if (y < h - 1 && mask[p + w] === 1) { mask[p + w] = 2; stack[sp++] = p + w; }
    }
    if (cnt < 20 || sum / cnt < BOX_SCORE) continue;

    // unclip: ขยายสี่เหลี่ยมตามสูตร DB (area * ratio / perimeter)
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
    const dist = (bw * bh * UNCLIP) / (2 * (bw + bh));
    boxes.push({
      x0: Math.max(0, Math.floor((x0 - dist) * sx)),
      y0: Math.max(0, Math.floor((y0 - dist) * sy)),
      x1: Math.min(img.width,  Math.ceil((x1 + dist) * sx)),
      y1: Math.min(img.height, Math.ceil((y1 + dist) * sy)),
    });
  }
  return boxes; // ลำดับการอ่านจัดทีหลังใน readingOrder
}

// ====== Recognition (CTC greedy) ======
const median = (a) => {
  const s = Float32Array.from(a).sort(), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};

// ลบพื้นหลังทีละคอลัมน์ (จากขอบบน-ล่างของบรรทัด) ได้ตัวอักษรเข้มบนพื้นขาว
// ไม่ว่าจะเป็นตัวสีอ่อนบนพื้นเข้มหรือพื้นไล่สี (_flatten ใน line_engine.py)
function flatten(g, W, H) {
  const k = Math.max(2, Math.floor(H / 6));
  const col = new Float32Array(2 * k), bg0 = new Float32Array(W), bg = new Float32Array(W);
  for (let x = 0; x < W; x++) {
    for (let y = 0; y < k; y++) { col[y] = g[y * W + x]; col[k + y] = g[(H - 1 - y) * W + x]; }
    bg0[x] = Math.trunc(median(col));
  }
  const r = Math.max(3, Math.min(H | 1, 255)) >> 1, win = new Float32Array(2 * r + 1);
  for (let x = 0; x < W; x++) {
    for (let j = -r; j <= r; j++) win[j + r] = bg0[Math.min(W - 1, Math.max(0, x + j))];
    bg[x] = median(win);
  }
  const n = W * H, d = new Float32Array(n), hist = new Uint32Array(256);
  for (let i = 0; i < n; i++) { d[i] = Math.abs(g[i] - bg[i % W]); hist[Math.min(255, d[i] | 0)]++; }
  let hi = 0;
  for (let c = 0; hi < 255; hi++) { c += hist[hi]; if (c >= 0.98 * n) break; }
  hi = Math.max(hi, 24);
  for (let i = 0; i < n; i++) g[i] = 255 - Math.min(255, (d[i] * 255) / hi);
}

// ครอปกล่องจากรูป ย่อ/ขยายเป็น W x H แล้วแปลงเป็นภาพเทา (0-255)
function cropGrey(img, box, W, H) {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(img, box.x0, box.y0, box.x1 - box.x0, box.y1 - box.y0, 0, 0, W, H);
  const d = ctx.getImageData(0, 0, W, H).data;
  const g = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) g[i] = Math.round(0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2]);
  return g;
}

// ตัดกล่องบรรทัดตรงช่องว่างที่กว้าง >= split_gap เท่าของความสูง และเล็มช่องว่างที่ปลายทิ้ง
// (detector อาจลากกล่องข้ามช่องว่างระหว่างคอลัมน์ไปถึงตัวแรกของคอลัมน์ถัดไป; split_one ใน line_engine.py)
function splitLine(img, b) {
  const ratio = cfg.det.split_gap, w = b.x1 - b.x0, h = b.y1 - b.y0;
  if (!ratio || w < 4 * h || h < 4) return [b];
  const g = cropGrey(img, b, w, h);
  flatten(g, w, h);
  const ink = new Uint8Array(w);
  for (let i = 0; i < w * h; i++) if (g[i] < 128) ink[i % w] = 1;
  const segs = [];
  let start = null, blank = 0;
  for (let x = 0; x < w; x++) {
    if (ink[x]) {
      if (start === null) start = x;
      else if (blank >= ratio * h) { segs.push([start, x - blank]); start = x; }
      blank = 0;
    } else if (start !== null) blank++;
  }
  if (start !== null) segs.push([start, w - blank]);
  if (!segs.length || (segs.length === 1 && segs[0][0] < ratio * h && w - segs[0][1] < ratio * h)) return [b];
  const pad = 0.15 * h;
  return segs.map(([s0, s1]) => ({ x0: b.x0 + Math.max(0, Math.floor(s0 - pad)), x1: b.x0 + Math.min(w, Math.ceil(s1 + pad)),
                                   y0: b.y0, y1: b.y1 }));
}

// ครอปบรรทัด -> ภาพเทาสูง cfg.rec.height ค่าอยู่ใน [-1, 1] (ใช้ซ้ำได้กับทั้ง rec และ rec2)
function prepLine(img, box) {
  const bw = box.x1 - box.x0, bh = box.y1 - box.y0;
  if (bw < 4 || bh < 4) return null;
  const H = cfg.rec.height;
  const W = Math.min(cfg.rec.max_w, Math.max(16, Math.ceil((H * bw) / bh)));
  const g = cropGrey(img, box, W, H);
  if (cfg.rec.color === "flatten") flatten(g, W, H);
  for (let i = 0; i < W * H; i++) g[i] = (g[i] / 255 - 0.5) / 0.5;
  return { grey: g, W, H };
}

async function recognize(session, { grey, W, H }) {
  const feed = async (ch) => {
    let data = grey;
    if (ch === 3) { data = new Float32Array(3 * W * H); for (let k = 0; k < 3; k++) data.set(grey, k * W * H); }
    const out = await session.run({ [session.inputNames[0]]: new ort.Tensor("float32", data, [1, ch, H, W]) });
    return out[session.outputNames[0]];
  };

  let out;
  try { out = await feed(recChannels); }
  catch (e) { recChannels = recChannels === 3 ? 1 : 3; out = await feed(recChannels); }

  const [, T, C] = out.dims;
  const p = out.data;
  let prev = -1, text = "", confSum = 0, confN = 0;
  for (let t = 0; t < T; t++) {
    let best = 0, bv = -Infinity;
    for (let k = 0; k < C; k++) { const v = p[t * C + k]; if (v > bv) { bv = v; best = k; } }
    if (best !== 0 && best !== prev) { text += charset[best] ?? ""; confSum += bv; confN++; }
    prev = best;
  }
  return { text, conf: confN ? confSum / confN : 0 };
}

// ====== หลังอ่าน: จัดรูปข้อความไทย + กรองบรรทัด (thai_norm.py / line_engine.py v2.1.4) ======
// glyph ไทยแบบเก่าใน Private Use Area -> อักขระมาตรฐาน
const PUA = [0x0E10, 0x0E34, 0x0E35, 0x0E36, 0x0E37, 0x0E48, 0x0E49, 0x0E4A, 0x0E4B, 0x0E4C, 0x0E48, 0x0E49,
  0x0E4A, 0x0E4B, 0x0E4C, 0x0E0D, 0x0E31, 0x0E4D, 0x0E47, 0x0E48, 0x0E49, 0x0E4A, 0x0E4B, 0x0E4C, 0x0E38, 0x0E39, 0x0E3A];
const VOWEL_MARKS = "ัิีึืฺุู็";
const TONE_MARKS  = "่้๊๋์๎";
const MARK_RUN = new RegExp("[" + VOWEL_MARKS + TONE_MARKS + "ํ]{2,}", "g");
const markRank = (c) => (VOWEL_MARKS.includes(c) ? 0 : TONE_MARKS.includes(c) ? 1 : 2);

// รูปแบบเดียวของข้อความไทยที่พิมพ์ได้หลายแบบแต่แสดงผลเหมือนกัน (canonical ใน thai_norm.py)
function canonical(text) {
  text = text.replace(/[-]/g, (c) => String.fromCharCode(PUA[c.charCodeAt(0) - 0xF700]))
    .replace(/[​‌‍⁠­﻿]/g, "").replace(/ /g, " ").normalize("NFC");
  text = text.replace(MARK_RUN, (run) => [...run].sort((a, b) => markRank(a) - markRank(b))
    .filter((c, i, a) => i === 0 || a[i - 1] !== c).join(""));
  text = text.replace(/([่-๋]?)ํ([่-๋]?)า/g, "$1$2ำ")
    .replaceAll("เเ", "แ").replaceAll("ำำ", "ำ");
  return text.replace(/[ \t\f\v]+/g, " ").trim();
}

// W ที่ควรเป็น พ, 0/O ติดกับเลขไทยที่ควรเป็น ๐
const fixScripts = (t) => t.replace(/(?<![A-Za-z])[Ww](?=\.?[ก-ฮเ-ไ])/g, "พ")
  .replace(/(?<=[๐-๙])[Oo0]|[Oo0](?=[๐-๙])/g, "๐");
// จำนวนเงินที่ใช้ comma แทนจุดทศนิยม: "280,00" -> "280.00"
const DECIMAL_COMMA = /(?<![0-9๐-๙.,])([0-9๐-๙]{1,3}(?:,[0-9๐-๙]{3})*),([0-9๐-๙]{2})(?![0-9๐-๙.,])/g;

// จำนวนอักษรละตินที่ปนอยู่ในคำไทย: "lละพลNSะทU" -> 4 (สัญญาณว่าเป็นฟอนต์ไม่มีหัว ให้ลอง rec2)
const mixed = (text) => text.split(/\s+/).filter((tok) => /[ก-๎]/.test(tok))
  .reduce((n, tok) => n + (tok.match(/[A-Za-z]/g) || []).length, 0);

// สัดส่วนอักขระไทยที่ผิดหลักการสะกด (สระ/วรรณยุกต์ไม่มีพยัญชนะรองรับ ฯลฯ) ใช้กรองตราประทับ/ลายเซ็น
const MARKS = "ัิีึืฺุู็่้๊๋์ํ๎";
const isCons = (c) => c >= "ก" && c <= "ฮ";
function invalidShare(text) {
  const s = [...text];
  let thai = 0, bad = 0;
  s.forEach((ch, i) => {
    if (ch < "฀" || ch > "๿") return;
    thai++;
    const prev = i ? s[i - 1] : " ";
    if (MARKS.includes(ch) && !(isCons(prev) || (MARKS.includes(prev) && i >= 2 && isCons(s[i - 2])))) bad++;
    else if ("เแโใไ".includes(ch) && !(i + 1 < s.length && isCons(s[i + 1]))) bad++;
  });
  return thai ? bad / thai : 0;
}

// ความสูงบรรทัดปกติของหน้า: median ของกล่องที่กว้างอย่างน้อย 2 เท่าของความสูง
function lineHeight(boxes) {
  const hs = boxes.map((b) => Math.max(b.y1 - b.y0, 1));
  const lines = hs.filter((h, i) => boxes[i].x1 - boxes[i].x0 >= 2 * h);
  return hs.length ? median(lines.length >= 3 ? lines : hs) : 1;
}

// เหตุผลที่ทิ้งบรรทัด หรือ null ถ้าเก็บไว้; hratio = ความสูงกล่อง / ความสูงบรรทัดปกติ
function dropReason(text, conf, hratio) {
  const rc = cfg.rec;
  if (!text) return "empty";
  if (conf < rc.drop_below) return "low_confidence";
  const bare = text.replaceAll(" ", "");
  const cls = rc.min_chars_latin ? /^[0-9๐-๙A-Za-z]+$/ : /^[0-9๐-๙]+$/;
  let short = rc.min_chars;
  // ตัวเลข/ตัวอักษรตัวเดียวในช่องตารางไม่ใช่ขยะ ถ้ากล่องสูงพอ
  if (rc.min_chars_digits != null && cls.test(bare) &&
      (rc.min_chars_digits_height <= 0 || hratio >= rc.min_chars_digits_height)) short = rc.min_chars_digits;
  if ([...bare].length < short) return "too_short";
  if (conf < rc.junk_below && invalidShare(text) > rc.junk_invalid) return "invalid_thai";
  return null;
}

// ====== ลำดับการอ่าน: แยกคอลัมน์ด้วย XY-cut (reading_order / _blocks ใน line_engine.py) ======
// กล่องในที่นี้เป็นสี่เหลี่ยมตั้งตรง จึงไม่มีขั้นแก้ภาพเอียง (deskew) แบบต้นฉบับ
const mean = (a) => a.reduce((s, v) => s + v, 0) / a.length;
const isDigit = (c) => /[0-9๐-๙]/.test(c);

// ช่องว่างระหว่างช่วง [lo, hi] ที่กว้างอย่างน้อย minGap
function gaps(iv, minGap) {
  iv = [...iv].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const out = [];
  let reach = iv[0][1];
  for (const [lo, hi] of iv.slice(1)) {
    if (lo - reach >= minGap) out.push([reach, lo]);
    reach = Math.max(reach, hi);
  }
  return out;
}

// คอลัมน์ฝั่งที่ติดกับร่องคอลัมน์ (ฝั่งหนึ่งอาจมีหลายคอลัมน์)
function nextTo(side, ext, hmed, gutterOnRight) {
  if (!side.length) return side;
  const g = gaps(side.map((i) => [ext[i][0], ext[i][1]]), 0.8 * hmed);
  if (!g.length) return side;
  return gutterOnRight ? side.filter((i) => ext[i][0] >= g[g.length - 1][1]) : side.filter((i) => ext[i][1] <= g[0][0]);
}

// คอลัมน์ข้อความเรียงความ: >= 12 บรรทัด, บรรทัดยาว, ครึ่งหนึ่งเต็มความกว้างคอลัมน์, ตัวเลขไม่เกิน 30%, ไม่ซ้ำกัน
// (ตารางและรายการไม่ผ่าน จึงยังอ่านเป็นแถวตามเดิม)
function isProse(col, ext, hmed, texts) {
  if (col.length < 12) return false;
  const widths = col.map((i) => ext[i][1] - ext[i][0]);
  const span = Math.max(...col.map((i) => ext[i][1])) - Math.min(...col.map((i) => ext[i][0]));
  if (median(widths) < 7 * hmed || mean(widths.map((w) => (w >= 0.75 * span ? 1 : 0))) < 0.35) return false;
  const chars = col.flatMap((i) => [...texts[i]]).filter((c) => !/\s/.test(c));
  if (chars.length && chars.filter(isDigit).length > 0.3 * chars.length) return false;
  if (new Set(col.map((i) => texts[i].trim())).size < 0.8 * col.length) return false;
  return true;
}

const enumOf = (t) => {
  const m = /^\s*\(?([0-9๐-๙]{1,4})\s*[.)]/.exec(t);
  return m ? +m[1].replace(/[๐-๙]/g, (c) => c.charCodeAt(0) - 0x0E50) : null;
};

// รายการที่เลขเรียงข้ามแถว (ซ้าย n, ขวา n+1) ต้องอ่านข้ามไปทางขวา ไม่ใช่ทีละคอลัมน์
function numberedAcross(lcol, rcol, ext, hmed, texts) {
  let pairs = 0;
  for (const i of lcol) {
    const a = enumOf(texts[i]);
    if (a === null) continue;
    const cy = (ext[i][2] + ext[i][3]) / 2;
    if (rcol.some((j) => enumOf(texts[j]) === a + 1 && Math.abs((ext[j][2] + ext[j][3]) / 2 - cy) <= 0.5 * hmed)) pairs++;
  }
  return pairs >= 0.5 * Math.min(lcol.length, rcol.length);
}

// สัดส่วนบรรทัดที่ขึ้นต้น 3 ตัวแรกเหมือนกัน (เลขนับเป็นตัวเดียว) เช่น "นาย…", "กรรมการ…"
function startRep(lines) {
  const st = lines.map((x) => x.trim()).filter(Boolean).map((x) => [...x.replace(/[0-9๐-๙]+/g, "D")].slice(0, 3).join(""));
  if (!st.length) return 0;
  const counts = {};
  for (const x of st) counts[x] = (counts[x] || 0) + 1;
  const top = Object.values(counts).sort((a, b) => b - a);
  return (top[0] + (top[1] || 0)) / st.length;
}

// สองฝั่งของช่องว่างเป็นคอลัมน์ของรายการ (ชื่อ | ตำแหน่ง) ที่ต้องอ่านทีละแถว
function listPair(lcol, rcol, ext, hmed, texts) {
  const r = cfg.cols;
  if (!(r.list_rep || r.list_facing || r.list_enum) || !lcol.length || !rcol.length) return false;
  if (r.list_rep && mean([lcol, rcol].map((col) => startRep(col.map((i) => texts[i])))) >= r.list_rep) return true;
  const [small, other] = lcol.length <= rcol.length ? [lcol, rcol] : [rcol, lcol];
  const cyO = other.map((j) => (ext[j][2] + ext[j][3]) / 2);
  const face = mean(small.map((i) => (cyO.some((c) => Math.abs((ext[i][2] + ext[i][3]) / 2 - c) <= 0.5 * hmed) ? 1 : 0)));
  const wide = Math.max(...[lcol, rcol].map((col) => median(col.map((i) => ext[i][1] - ext[i][0])))) / hmed;
  if (r.list_facing && face >= r.list_facing && wide < (r.list_max_w ?? 10)) return true;
  if (r.list_enum && face >= 0.6) return mean(lcol.map((i) => (enumOf(texts[i]) !== null ? 1 : 0))) >= r.list_enum;
  return false;
}

const isColumnPair = (lcol, rcol, ext, hmed, texts) =>
  isProse(lcol, ext, hmed, texts) && isProse(rcol, ext, hmed, texts) &&
  !numberedAcross(lcol, rcol, ext, hmed, texts) && !listPair(lcol, rcol, ext, hmed, texts);

// XY-cut แบบ recursive: ตัดแนวตั้งก่อน (ร่องที่ไม่มีบรรทัดไหนพาดผ่าน ระหว่างคอลัมน์เรียงความสองฝั่ง)
// ไม่งั้นตัดแนวนอนที่ช่องว่างกว้างสุด (เช่น หัวเรื่องเต็มความกว้างเหนือคอลัมน์)
function cutBlocks(idx, ext, hmed, texts, depth) {
  if (idx.length < 6 || depth > 12) return [idx];
  const cuts = [];
  for (const [g0, g1] of gaps(idx.map((i) => [ext[i][0], ext[i][1]]), 0.8 * hmed)) {
    const left = idx.filter((i) => ext[i][1] <= g0), right = idx.filter((i) => ext[i][0] >= g1);
    if (isColumnPair(nextTo(left, ext, hmed, true), nextTo(right, ext, hmed, false), ext, hmed, texts))
      cuts.push([g1 - g0, left, right]);
  }
  if (cuts.length) {
    const [, left, right] = cuts.reduce((a, c) => (c[0] > a[0] ? c : a));
    return [...cutBlocks(left, ext, hmed, texts, depth + 1), ...cutBlocks(right, ext, hmed, texts, depth + 1)];
  }
  const hg = gaps(idx.map((i) => [ext[i][2], ext[i][3]]), 0.8 * hmed);
  if (!hg.length) return bandedColumns(idx, ext, hmed, texts, depth) || [idx];
  const [g0, g1] = hg.reduce((a, g) => (g[1] - g[0] > a[1] - a[0] ? g : a));
  return [...cutBlocks(idx.filter((i) => ext[i][3] <= g0), ext, hmed, texts, depth + 1),
          ...cutBlocks(idx.filter((i) => ext[i][2] >= g1), ext, hmed, texts, depth + 1)];
}

// คอลัมน์ที่มีบรรทัดเต็มความกว้างพาดผ่าน (หัวเรื่อง, footer, คำบรรยายภาพ) ซึ่ง cut ปกติหาร่องไม่เจอ:
// เอาบรรทัดกว้างออกก่อน หาร่องในช่วงกลาง 70% ที่มีบรรทัดพาดไม่เกิน 3% แล้วแบ่งหน้าเป็นแถบ
// แต่ละแถบอ่านฝั่งซ้ายก่อนแล้วฝั่งขวา ตามด้วยบรรทัดกว้างที่คั่นอยู่
function bandedColumns(idx, ext, hmed, texts, depth) {
  const x0 = Math.min(...idx.map((i) => ext[i][0])), x1 = Math.max(...idx.map((i) => ext[i][1]));
  const wide = idx.filter((i) => ext[i][1] - ext[i][0] >= 0.55 * (x1 - x0));
  if (wide.length > 0.15 * idx.length) return null;
  const wideSet = new Set(wide), rest = idx.filter((i) => !wideSet.has(i));
  if (rest.length < 24) return null;
  const lo = Math.trunc(x0 + 0.15 * (x1 - x0)), n = Math.trunc(0.7 * (x1 - x0)) + 1;
  const cover = new Int32Array(n);
  for (const i of rest) {
    const a = Math.max(0, Math.trunc(ext[i][0]) - lo), b = Math.min(n, Math.ceil(ext[i][1]) - lo);
    for (let x = a; x < b; x++) cover[x]++;
  }
  const maxCover = Math.max(1, Math.trunc(0.03 * rest.length)), runs = [];
  for (let x = 0, s = null; x <= n; x++) {
    const free = x < n && cover[x] <= maxCover;
    if (free && s === null) s = x;
    else if (!free && s !== null) { if (x - s >= 0.4 * hmed) runs.push([lo + s, lo + x]); s = null; }
  }
  let best = null;
  runs.forEach(([g0, g1], k) => {
    const lcol = rest.filter((i) => ext[i][1] <= g0 && (k === 0 || ext[i][0] >= runs[k - 1][1]));
    const rcol = rest.filter((i) => ext[i][0] >= g1 && (k === runs.length - 1 || ext[i][1] <= runs[k + 1][0]));
    if (isColumnPair(lcol, rcol, ext, hmed, texts) && (best === null || g1 - g0 > best[0])) best = [g1 - g0, g0, g1];
  });
  if (!best) return null;
  const [, g0, g1] = best, gm = (g0 + g1) / 2;
  const cy = (i) => (ext[i][2] + ext[i][3]) / 2, cx = (i) => (ext[i][0] + ext[i][1]) / 2;
  const mid = rest.filter((i) => ext[i][0] < g0 && ext[i][1] > g1), midSet = new Set(mid);
  const seps = [...wide, ...mid].sort((a, b) => cy(a) - cy(b));
  const out = [];
  for (let b = 0; b <= seps.length; b++) {
    const top = b ? cy(seps[b - 1]) : -Infinity, bot = b < seps.length ? cy(seps[b]) : Infinity;
    const band = rest.filter((i) => !midSet.has(i) && top < cy(i) && cy(i) <= bot);
    for (const side of [band.filter((i) => cx(i) < gm), band.filter((i) => cx(i) >= gm)])
      if (side.length) out.push(...cutBlocks(side, ext, hmed, texts, depth + 1));
    if (b < seps.length) out.push([seps[b]]);
  }
  return out;
}

// แถวจากบนลงล่าง แต่ละแถวซ้ายไปขวา โดยอ่านทีละบล็อก (คอลัมน์) -> [[index กล่อง, ...], ...]
function readingOrder(boxes, texts) {
  if (!boxes.length) return [];
  const ext = boxes.map((b) => [b.x0, b.x1, b.y0, b.y1]);
  const hmed = lineHeight(boxes);
  const blocks = cutBlocks(boxes.map((_, i) => i), ext, hmed, texts, 0);
  const cy = ext.map((e) => (e[2] + e[3]) / 2), rx = ext.map((e) => (e[0] + e[1]) / 2);
  const hs = boxes.map((b) => Math.max(b.y1 - b.y0, 1));
  const tol = 0.5 * hmed, rows = [];
  for (const blk of blocks) {
    // จัดแถวจากบรรทัดเต็มความสูงก่อน กล่องเล็ก (สระ/วรรณยุกต์หลุด) ค่อยเข้าแถวที่ใกล้สุดทีหลัง
    let full = blk.filter((i) => hs[i] >= 0.6 * hmed);
    if (!full.length) full = [...blk];
    const fullSet = new Set(full), small = blk.filter((i) => !fullSet.has(i));
    const brows = [];
    for (const i of [...full].sort((a, b) => cy[a] - cy[b])) {
      const last = brows[brows.length - 1];
      if (last && Math.abs(cy[i] - mean(last.map((j) => cy[j]))) <= tol) last.push(i);
      else brows.push([i]);
    }
    const centre = brows.map((r) => mean(r.map((j) => cy[j])));
    for (const i of small) {
      let k = -1, bd = Infinity;
      centre.forEach((c, n) => { const d = Math.abs(cy[i] - c); if (d < bd) { bd = d; k = n; } });
      if (k >= 0 && bd <= tol + 0.5 * hs[i]) brows[k].push(i);
      else { brows.push([i]); centre.push(cy[i]); }
    }
    const order = brows.map((_, n) => n).sort((a, b) => centre[a] - centre[b]);
    for (const n of order) rows.push(brows[n].sort((a, b) => rx[a] - rx[b]));
  }
  return rows;
}

// ====== Main ======
// อ่านกล่องเดียว; มีอักษรละตินปนในคำไทย -> อ่านซ้ำด้วย rec2 แล้วเก็บผลที่ปนน้อยกว่า
async function readBox(img, b) {
  const line = prepLine(img, b);
  if (!line) return { text: "", conf: 0, rec2: false };
  const r = await recognize(recSession, line);
  if (rec2Session && mixed(r.text) >= cfg.rec2.min_mixed) {
    const alt = await recognize(rec2Session, line);
    if (mixed(alt.text) < mixed(r.text)) return { ...alt, rec2: true };
  }
  return { ...r, rec2: false };
}

async function processImage(img) {
  const view = $("view");
  view.width = img.width; view.height = img.height;
  const vctx = view.getContext("2d");
  vctx.drawImage(img, 0, 0);
  $("out").value = "";

  try {
    await loadModels();
    status("กำลังหาตำแหน่งข้อความ...");
    const { tensor, w, h } = runDetPre(img);
    const res = await detSession.run({ [detSession.inputNames[0]]: tensor });
    const prob = res[detSession.outputNames[0]].data;
    const boxes = findBoxes(prob, w, h, img);

    // ตัดบรรทัดที่ลากข้ามร่องคอลัมน์ แล้วอ่านทั้งชิ้นที่ตัดและบรรทัดเต็ม (ไว้เทียบกัน)
    const groups = boxes.map((b) => splitLine(img, b));
    const changed = groups.map((g, n) => g.length > 1 || g[0] !== boxes[n]);
    const pieces = groups.flat(), toRead = [...pieces, ...boxes.filter((_, n) => changed[n])];
    const reads = [];
    vctx.strokeStyle = "#9ca3af";
    vctx.lineWidth = Math.max(2, img.width / 500);
    for (let i = 0; i < toRead.length; i++) {
      status(`กำลังอ่านบรรทัด ${i + 1}/${toRead.length}...`);
      if (i < pieces.length) { const b = pieces[i]; vctx.strokeRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0); }
      reads.push(await readBox(img, toRead[i]));
      await new Promise((ok) => setTimeout(ok)); // ให้ UI วาดได้
    }

    // ใช้ชิ้นที่ตัดเมื่อทุกชิ้นมั่นใจพอ และได้ตัวอักษรรวม >= 90% ของบรรทัดเต็ม ไม่งั้นใช้บรรทัดเต็ม
    const final = [], out = [], nChars = (r) => r.text.replaceAll(" ", "").length;
    let k = 0, e = pieces.length;
    boxes.forEach((b, n) => {
      const g = groups[n], r = reads.slice(k, k + g.length);
      k += g.length;
      if (changed[n]) {
        const whole = reads[e++];
        if (Math.min(...r.map((x) => x.conf)) < cfg.rec.drop_below ||
            r.reduce((s, x) => s + nChars(x), 0) < 0.9 * nChars(whole)) { final.push(b); out.push(whole); return; }
      }
      final.push(...g); out.push(...r);
    });

    const rows = readingOrder(final, out.map((r) => r.text));
    const hmed = lineHeight(final), rowTexts = [];
    vctx.drawImage(img, 0, 0);
    vctx.font = `bold ${Math.max(12, Math.round(hmed * 0.45))}px system-ui, sans-serif`;
    vctx.textBaseline = "top";
    let order = 0, used = 0;
    for (const row of rows) {
      const parts = [];
      for (const i of row) {
        const b = final[i], r = out[i];
        let text = fixScripts(canonical(r.text));
        if (cfg.join.decimal_comma) text = text.replace(DECIMAL_COMMA, "$1.$2");
        const reason = dropReason(text, r.conf, (b.y1 - b.y0) / hmed);
        const color = reason ? "#dc2626" : "#16a34a";
        vctx.strokeStyle = color;
        vctx.strokeRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
        // ป้ายลำดับการอ่านที่มุมซ้ายบนของกล่อง
        const label = String(++order), tw = vctx.measureText(label).width + 6;
        vctx.fillStyle = color;
        vctx.fillRect(b.x0, b.y0, tw, Math.max(12, Math.round(hmed * 0.45)) + 4);
        vctx.fillStyle = "#fff";
        vctx.fillText(label, b.x0 + 3, b.y0 + 2);
        if (reason) { console.debug("ทิ้ง:", reason, text, r.conf.toFixed(3)); continue; }
        parts.push(text); used++;
      }
      if (parts.length) rowTexts.push(parts.join(" "));
    }
    $("out").value = rowTexts.join("\n");
    const nRec2 = out.filter((r) => r.rec2).length;
    status(`เสร็จแล้ว: พบ ${final.length} กล่อง, ใช้ ${used} กล่อง (${rowTexts.length} บรรทัด)` +
      (nRec2 ? `, แก้ฟอนต์ไม่มีหัวด้วย rec2 ${nRec2} กล่อง` : "") +
      " (กรอบเขียว = ผ่าน, แดง = ถูกกรองทิ้ง, ตัวเลข = ลำดับการอ่าน)");
  } catch (e) {
    console.error(e);
    status("เกิดข้อผิดพลาด: " + e.message);
  }
}

async function handleFile(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const img = await createImageBitmap(file);
  processImage(img);
}

$("file").addEventListener("change", (e) => handleFile(e.target.files[0]));
$("copy").addEventListener("click", () => navigator.clipboard.writeText($("out").value));
document.addEventListener("paste", (e) => {
  const f = [...e.clipboardData.files].find((x) => x.type.startsWith("image/"));
  if (f) handleFile(f);
});
const drop = $("drop");
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); handleFile(e.dataTransfer.files[0]); });
</script>
